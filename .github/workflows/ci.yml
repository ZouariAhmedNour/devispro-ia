name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: supabase db start
      - run: supabase test db

  edge-tests:
    runs-on: ubuntu-latest
    env:
      DENO_NO_PACKAGE_JSON: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8
      - run: deno check --config supabase/functions/generate-quote/deno.json supabase/functions/generate-quote/index.ts
      - run: deno test --config supabase/functions/generate-quote/deno.json supabase/functions/generate-quote/
      - run: deno check --config supabase/functions/transcribe/deno.json supabase/functions/transcribe/index.ts
      - run: deno test --config supabase/functions/transcribe/deno.json supabase/functions/transcribe/