name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: supabase db start
      - run: supabase test db

  edge-tests:
    runs-on: ubuntu-latest
    env:
      DENO_NO_PACKAGE_JSON: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8
      - run: deno check --config supabase/functions/generate-quote/deno.json supabase/functions/generate-quote/index.ts
      - run: deno test --config supabase/functions/generate-quote/deno.json supabase/functions/generate-quote/
      - run: deno check --config supabase/functions/transcribe/deno.json supabase/functions/transcribe/index.ts
      - run: deno test --config supabase/functions/transcribe/deno.json supabase/functions/transcribe/
      - run: deno check --config supabase/functions/quote-pdf/deno.json supabase/functions/quote-pdf/index.ts
      - run: deno test --config supabase/functions/quote-pdf/deno.json supabase/functions/quote-pdf/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: pnpm install --frozen-lockfile

      # Supabase minimal : base, Auth, API REST (pas de Studio, Storage, fonctions…)
      - run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # Expose API_URL et ANON_KEY aux étapes suivantes
      - run: supabase status -o env | sed 's/"//g' >> "$GITHUB_ENV"

      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
        env:
          CI: "true"
          VITE_SUPABASE_URL: ${{ env.API_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}

      # En cas d'échec : rapport avec captures et traces, téléchargeable depuis la PR
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7